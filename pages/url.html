<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 工具 - DevTools</title>

  <!-- Monaco Editor CSS -->
  <link rel="stylesheet" data-name="vs/editor/editor.main"
    href="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.css">

  <!-- 共享样式 -->
  <link rel="stylesheet" href="../css/common.css">

  <!-- URL工具特定样式 -->
  <style>
    .url-tool {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .url-controls {
      display: flex;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) 0;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .url-editor-container {
      flex: 1;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-tertiary);
      min-height: 0;
    }

    .url-editor {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .url-controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="content">
    <div class="content-header">
      <h1>
        <svg class="tool-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
          style="margin-right: 8px; vertical-align: middle;">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.71 1.71" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="12" cy="12" r="1" fill="currentColor" />
        </svg>
        URL 工具
      </h1>
      <p>URL 编码和解码，处理特殊字符和查询参数</p>
    </div>

    <div class="tool-page-content">
      <div class="tool-page-body">
        <div class="url-tool">
          <!-- 控制按钮 -->
          <div class="url-controls">
            <button class="btn btn-primary" onclick="encodeUrl()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 9h6a4 4 0 0 1 0 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M18 15h-6a4 4 0 0 1 0-8h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <circle cx="12" cy="13" r="1" fill="currentColor" />
                <circle cx="12" cy="9" r="1" fill="currentColor" />
              </svg>
              编码
            </button>
            <button class="btn btn-secondary" onclick="decodeUrl()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 15h6a4 4 0 0 0 0-8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <path d="M18 9h-6a4 4 0 0 0 0 8h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" />
                <circle cx="12" cy="13" r="1" fill="currentColor" />
                <circle cx="12" cy="9" r="1" fill="currentColor" />
                <path d="M8 12h8" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
              </svg>
              解码
            </button>
            <button class="btn btn-secondary" onclick="copyOutput()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" />
              </svg>
              复制结果
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              清空
            </button>
          </div>

          <!-- 编辑器容器 -->
          <div class="url-editor-container">
            <div id="urlEditor" class="url-editor"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 共享JavaScript -->
  <script src="../js/common.js"></script>

  <!-- Monaco Editor JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>

  <!-- 页面特定JavaScript -->
  <script>
    let urlEditor;
    let urlTool;

    // 初始化Monaco Editor
    function initMonacoEditor() {
      require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' } });
      require(['vs/editor/editor.main'], function () {
        // 创建URL编辑器
        urlEditor = monaco.editor.create(document.getElementById('urlEditor'), {
          value: '',
          language: 'plaintext',
          theme: getMonacoTheme(),
          automaticLayout: true,
          minimap: { enabled: false },
          scrollBeyondLastLine: false,
          wordWrap: 'on',
          formatOnPaste: true,
          suggest: {
            showKeywords: false,
            showSnippets: false
          },
          quickSuggestions: {
            other: false,
            comments: false,
            strings: false
          }
        });

        // 初始化工具
        urlTool = new UrlTool();
        urlTool.init();

        // 设置焦点到编辑器
        urlEditor.focus();
      });
    }

    // 获取Monaco主题
    function getMonacoTheme() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'vs-dark'
        : 'vs';
    }

    class UrlTool {
      constructor() {
        this.bindEvents();
      }

      init() {
        // 监听主题变化
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            const newTheme = getMonacoTheme();
            monaco.editor.setTheme(newTheme);
            urlEditor.updateOptions({ theme: newTheme });
          });
        }

        // 添加键盘快捷键
        this.addKeyboardShortcuts();
      }

      addKeyboardShortcuts() {
        document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            this.encodeUrl();
          }
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'Enter') {
            e.preventDefault();
            this.decodeUrl();
          }
          if ((e.ctrlKey || e.metaKey) && e.key === 'Delete') {
            e.preventDefault();
            this.clearAll();
          }
        });
      }

      bindEvents() {
        // 简化的事件绑定，不再需要URL类型检测
      }

      encodeUrl() {
        const currentText = urlEditor.getValue();

        if (!currentText.trim()) {
          this.showError('请输入要编码的内容');
          return;
        }

        try {
          // 使用encodeURIComponent作为默认编码方式，更通用
          const encoded = encodeURIComponent(currentText);
          urlEditor.setValue(encoded);
          this.showSuccess('URL 编码成功');
        } catch (error) {
          urlEditor.setValue(`编码错误: ${error.message}`);
          this.showError('URL 编码失败');
        }
      }

      decodeUrl() {
        const currentText = urlEditor.getValue();

        if (!currentText.trim()) {
          this.showError('请输入要解码的 URL 编码');
          return;
        }

        try {
          const decoded = decodeURIComponent(currentText);
          urlEditor.setValue(decoded);
          this.showSuccess('URL 解码成功');
        } catch (error) {
          urlEditor.setValue(`解码错误: 无效的 URL 编码`);
          this.showError('URL 解码失败，请检查输入格式');
        }
      }

      copyOutput() {
        const editorValue = urlEditor ? urlEditor.getValue() : '';
        if (editorValue) {
          navigator.clipboard.writeText(editorValue).then(() => {
            if (window.showNotification) {
              window.showNotification('已复制到剪贴板', 'success');
            }
          }).catch(() => {
            if (window.showNotification) {
              window.showNotification('复制失败', 'error');
            }
          });
        }
      }

      clearAll() {
        if (urlEditor) {
          urlEditor.setValue('');
          urlEditor.focus();
        }
      }

      showError(message) {
        if (window.showNotification) {
          window.showNotification(message, 'error');
        } else {
          alert(message);
        }
      }

      showSuccess(message) {
        if (window.showNotification) {
          window.showNotification(message, 'success');
        }
      }
    }

    // 全局函数，供按钮调用
    function encodeUrl() {
      if (urlTool) urlTool.encodeUrl();
    }

    function decodeUrl() {
      if (urlTool) urlTool.decodeUrl();
    }

    function copyOutput() {
      if (urlTool) urlTool.copyOutput();
    }

    function clearAll() {
      if (urlTool) urlTool.clearAll();
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', function () {
      initMonacoEditor();
    });
  </script>
</body>

</html>
