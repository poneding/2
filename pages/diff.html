<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文本对比 - DevTools</title>

  <!-- Monaco Editor CSS -->
  <link rel="stylesheet" data-name="vs/editor/editor.main"
    href="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.css">

  <!-- 共享样式 -->
  <link rel="stylesheet" href="../css/common.css">

  <!-- 文本对比工具特定样式 -->
  <style>
    .diff-tool {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .diff-controls {
      display: flex;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) 0;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .diff-container {
      flex: 1;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-tertiary);
      min-height: 0;
    }

    .diff-editor {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .diff-controls {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="content">
    <div class="content-header">
      <h1>
        <svg class="tool-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
          style="margin-right: 8px; vertical-align: middle;">
          <rect x="3" y="4" width="18" height="16" rx="2" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" />
          <path d="M6 8h4M6 11h2M14 8h4M14 11h2M6 14h6M12 14h6" stroke="#dc3545" stroke-width="2"
            stroke-linecap="round" />
          <path d="M6 17h12" stroke="#28a745" stroke-width="2" stroke-linecap="round" />
          <text x="7" y="16" font-size="6" fill="#dc3545" font-weight="bold">-</text>
          <text x="15" y="16" font-size="6" fill="#28a745" font-weight="bold">+</text>
        </svg>
        文本对比
      </h1>
      <p>实时文本差异比较工具，支持直接编辑和语法高亮</p>
    </div>

    <div class="tool-page-content">
      <div class="tool-page-body">
        <div class="diff-tool">
          <!-- 控制按钮 -->
          <div class="diff-controls">
            <button class="btn btn-secondary" onclick="clearAll()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              清空
            </button>
          </div>

          <div class="diff-container">
            <div id="diffEditor" class="diff-editor">
              <div class="loading">正在加载编辑器</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 共享JavaScript -->
      <script src="../js/common.js"></script>

      <!-- 页面特定JavaScript -->
      <script>
        class DiffTool extends ToolPage {
          constructor() {
            super('diff');
            this.diffEditor = null;
            this.init();
          }

          async init() {
            try {
              await this.loadMonaco();
              this.initDiffEditor();
              this.bindEvents();
              this.updateStatus('编辑器已加载 - 显示示例代码对比');
            } catch (error) {
              this.updateStatus('编辑器加载失败: ' + error.message);
              this.showError('编辑器加载失败');
            }
          }

          async loadMonaco() {
            return new Promise((resolve, reject) => {
              if (window.monaco) {
                resolve();
                return;
              }

              const script = document.createElement('script');
              script.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js';
              script.onload = () => {
                require.config({
                  paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }
                });
                require(['vs/editor/editor.main'], () => {
                  resolve();
                });
              };
              script.onerror = reject;
              document.head.appendChild(script);
            });
          }

          initDiffEditor() {
            const container = document.getElementById('diffEditor');
            const theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'vs-dark' : 'vs';

            // 清空容器
            container.innerHTML = '';

            // 初始化Diff编辑器
            this.diffEditor = monaco.editor.createDiffEditor(container, {
              theme: theme,
              automaticLayout: true,
              renderSideBySide: true,
              readOnly: false,
              enableSplitViewResizing: true,
              renderOverviewRuler: true,
              diffAlgorithm: 'smart',
              renderMarginRevertIcon: true,
              ignoreTrimWhitespace: false,
              renderWhitespace: 'selection',
              scrollBeyondLastLine: false,
              minimap: { enabled: false },
              fontSize: 14,
              lineNumbers: 'on',
              roundedSelection: false,
              originalEditable: true,
              modifiedEditable: true,
              semanticHighlighting: false,
              fontFamily: 'Cascadia Mono,Consolas, Menlo, Monaco, Ubuntu Mono, monospace',
            });

            // 设置初始内容 - 左右两边不同的示例内容
            const originalText = ``;

            const modifiedText = ``;

            const language = this.detectLanguage(originalText, modifiedText);
            const originalModel = monaco.editor.createModel(originalText, language);
            const modifiedModel = monaco.editor.createModel(modifiedText, language);

            this.diffEditor.setModel({
              original: originalModel,
              modified: modifiedModel
            });

            // 监听主题变化
            if (window.matchMedia) {
              window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                const newTheme = e.matches ? 'vs-dark' : 'vs';
                if (this.diffEditor) {
                  monaco.editor.setTheme(newTheme);
                }
              });
            }
          }

          bindEvents() {
            // 监听键盘快捷键
            document.addEventListener('keydown', (e) => {
              if ((e.ctrlKey || e.metaKey) && e.key === 'Delete') {
                e.preventDefault();
                this.clearDiff();
              }
            });
          }


          clearDiff() {
            if (!this.diffEditor) {
              this.showError('编辑器尚未加载完成');
              return;
            }

            const emptyText = '';
            const emptyModel = monaco.editor.createModel(emptyText, 'plaintext');

            this.diffEditor.setModel({
              original: emptyModel,
              modified: emptyModel
            });

            this.updateStatus('已清空所有内容');
          }

          detectLanguage(text1, text2) {
            const combinedText = text1 + '\n' + text2;

            // 检测JavaScript
            if (combinedText.includes('function') || combinedText.includes('const ') ||
              combinedText.includes('let ') || combinedText.includes('=>')) {
              return 'javascript';
            }

            // 检测JSON
            try {
              JSON.parse(text1);
              return 'json';
            } catch {
              try {
                JSON.parse(text2);
                return 'json';
              } catch {
                // 不是JSON
              }
            }

            // 检测HTML
            if (combinedText.includes('<') && combinedText.includes('>') && combinedText.includes('</')) {
              return 'html';
            }

            // 检测CSS
            if (combinedText.includes('{') && combinedText.includes(':') && combinedText.includes(';')) {
              return 'css';
            }

            // 检测Python
            if (combinedText.includes('def ') || combinedText.includes('import ') ||
              combinedText.includes('print(') || combinedText.includes('#')) {
              return 'python';
            }

            // 默认为纯文本
            return 'plaintext';
          }
        }

        // 全局函数，供按钮调用
        function clearDiff() {
          if (window.diffTool) {
            window.diffTool.clearDiff();
          }
        }

        function clearAll() {
          clearDiff();
        }

        // 初始化工具
        document.addEventListener('DOMContentLoaded', function () {
          window.diffTool = new DiffTool();
        });
      </script>
</body>

</html>
